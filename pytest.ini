[pytest]
testpaths =
    ur_print_fdm/tests

# Ensure the repo root is importable when running `pytest` (console_script) on Windows.
pythonpath =
    .

# Work around inaccessible temp cache dirs that may exist in the workspace.
norecursedirs =
    pytest-cache-files-*
    .pytest_cache
    __pycache__
    manual_checks

# Avoid creating cache directories inside the repo on restricted filesystems.
addopts =
    -p no:cacheprovider
