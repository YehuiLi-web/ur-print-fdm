[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ur-print-fdm"
version = "0.1.0"
description = "UR5 Fiber Printer Studio (Expert Edition)"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
  "PyQt6>=6.5.0",
  "numpy>=1.24.0",
  "ur_rtde>=2.0.0",
  "paramiko>=3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-qt>=4",
  "pre-commit>=3.5.0",
  "ruff>=0.6",
  "mypy>=1.8",
  "types-paramiko",
]

[project.gui-scripts]
ur-print-fdm = "ur_print_fdm.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["ur_print_fdm*"]
exclude = ["tests*", "__pycache__*", "说明文档资料*"]

[tool.setuptools.package-data]
ur_print_fdm = ["ui/resources/icons/*.svg"]

[tool.ruff]
line-length = 100
target-version = "py311"
